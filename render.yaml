# Render Blueprint — API web service.
#
# MongoDB is Atlas (external, not provisioned by Render) — set MONGO_URI manually.
# Redis: point REDIS_URL at a Render Key Value instance's internal connection string
# (redis://<host>:6379 — no TLS/auth needed on Render's internal network) or any other
# managed Redis's URL (rediss://user:pass@host:port also works, TLS auto-detected —
# see configuration.ts's resolveRedisConfig). REDIS_HOST/PORT/PASSWORD/TLS are only
# ever a local-dev fallback (see .env.example) and are ignored outright whenever
# REDIS_URL is set, so this blueprint doesn't declare them at all.
#
# A separate `worker` service running BullMQ processors (penalty sweep, notification
# dispatch, funding reminders) will be added once src/platform/jobs exists (Phase 2+).
# It will share this same repo/image with an alternate start command (e.g.
# `node dist/worker`) rather than duplicating build config.
services:
  - type: web
    name: bckashprocessautomation-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_BASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: NIBSS_BASE_URL
        sync: false
      - key: NIBSS_CLIENT_ID
        sync: false
      - key: NIBSS_CLIENT_SECRET
        sync: false
      - key: NIBSS_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_SIGNED_URL_EXPIRES_IN
        value: 900
      - key: AWS_REKOGNITION_FACE_MATCH_THRESHOLD
        value: 90
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: BCKash Process Automation
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_BASE_URL
        value: https://api.ng.termii.com
